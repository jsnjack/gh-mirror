name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v6
        with:
          repository: jsnjack/monova
          ref: v2.1.0
          path: .tools/monova
          persist-credentials: false
      - name: Build tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          mkdir -p "$(go env GOPATH)/bin"
          go build -C .tools/monova -o "$(go env GOPATH)/bin/monova" .
      - name: Format, vet, build and race tests
        run: |
          make fmt vet build test
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
