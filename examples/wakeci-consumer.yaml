desc: Copy the published mirror before the gh-tidy analysis tasks
params:
  - REPOSITORY: owner/repository
  - ISSUE_NUMBER: "123"

tasks:
  - name: Copy the latest snapshot
    run: >-
      cp "/home/client/gh-mirror/snapshots/$(jq -r .filename /home/client/gh-mirror/snapshots/latest.json)"
      "${WAKE_BUILD_WORKSPACE}/mirror.sqlite"

  - name: Check freshness
    run: >-
      /home/client/bin/gh-mirror --db "${WAKE_BUILD_WORKSPACE}/mirror.sqlite"
      doctor --max-age 2h

  - name: Retrieve local candidates
    run: >-
      /home/client/bin/gh-mirror
      --db "${WAKE_BUILD_WORKSPACE}/mirror.sqlite"
      related "${REPOSITORY}#${ISSUE_NUMBER}"
      > duplicate-candidates.json

timeout: 10m
concurrency: 1
